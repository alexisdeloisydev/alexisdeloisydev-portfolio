<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: arial, sans-serif;
        font-size: 14px;
        color: #222;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 6px;
        min-height: 60px;
      }

      header a {
        color: rgba(0, 0, 0, 0.87);
        text-decoration: none;
        padding: 0 15px;
        font-size: 13px;
        line-height: 24px;
        transition: opacity 0.2s;
      }

      header a:hover {
        text-decoration: underline;
      }

      .apps-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin-left: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .apps-icon:hover {
        background-color: rgba(60, 64, 67, 0.08);
      }

      .apps-icon svg {
        width: 20px;
        height: 20px;
        fill: #5f6368;
      }

      .sign-in-btn {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 9px 23px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-left: 15px;
        transition:
          box-shadow 0.3s,
          background-color 0.3s;
      }

      .sign-in-btn:hover {
        background: #1765cc;
        box-shadow:
          0 1px 2px 0 rgba(66, 133, 244, 0.3),
          0 1px 3px 1px rgba(66, 133, 244, 0.15);
      }

      /* Main Content */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 130px;
      }

      .logo {
        margin-bottom: 25px;
      }

      .logo-text {
        font-family: "Product Sans", arial, sans-serif;
        font-size: 90px;
        font-weight: 400;
        letter-spacing: -2px;
        user-select: none;
      }

      .logo-text span:nth-child(1) {
        color: #4285f4;
      }
      .logo-text span:nth-child(2) {
        color: #ea4335;
      }
      .logo-text span:nth-child(3) {
        color: #fbbc04;
      }
      .logo-text span:nth-child(4) {
        color: #4285f4;
      }
      .logo-text span:nth-child(5) {
        color: #34a853;
      }
      .logo-text span:nth-child(6) {
        color: #ea4335;
      }

      /* Search Bar */
      .search-container {
        width: 584px;
        max-width: 90%;
        position: relative;
      }

      .search-bar {
        display: flex;
        align-items: center;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        height: 44px;
        padding: 0 14px;
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
        background: white;
      }

      .search-bar:hover {
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        border-color: rgba(223, 225, 229, 0);
      }

      .search-bar.focused {
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        border-color: rgba(223, 225, 229, 0);
      }

      .search-icon {
        width: 20px;
        height: 20px;
        margin-right: 13px;
      }

      .search-icon svg {
        width: 20px;
        height: 20px;
        fill: #9aa0a6;
      }

      .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #222;
        background: transparent;
      }

      .voice-icon,
      .lens-icon {
        width: 24px;
        height: 24px;
        cursor: pointer;
        padding: 0;
        margin-left: 8px;
      }

      .voice-icon svg,
      .lens-icon svg {
        width: 24px;
        height: 24px;
      }

      /* Buttons */
      .buttons-container {
        display: flex;
        gap: 14px;
        margin-top: 30px;
      }

      .search-btn {
        background-color: #f8f9fa;
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        color: #3c4043;
        font-size: 14px;
        padding: 10px 16px;
        cursor: pointer;
        transition:
          box-shadow 0.3s,
          border-color 0.3s,
          background-color 0.3s;
      }

      .search-btn:hover {
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        background-color: #f8f9fa;
        border: 1px solid #dadce0;
        color: #202124;
      }

      /* Language */
      .language-offered {
        margin-top: 24px;
        font-size: 13px;
        color: #222;
      }

      .language-offered a {
        color: #1a0dab;
        text-decoration: none;
        padding: 0 3px;
      }

      .language-offered a:hover {
        text-decoration: underline;
      }

      /* Footer */
      footer {
        background: #f2f2f2;
        border-top: 1px solid #e4e4e4;
      }

      .footer-country {
        padding: 15px 30px;
        border-bottom: 1px solid #dadce0;
        font-size: 15px;
        color: rgba(0, 0, 0, 0.54);
      }

      .footer-links {
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
        flex-wrap: wrap;
      }

      .footer-left,
      .footer-right {
        display: flex;
        padding: 15px;
      }

      .footer-links a {
        color: #70757a;
        text-decoration: none;
        padding: 15px;
        font-size: 14px;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        animation: fadeIn 0.4s ease-out;
      }

      .search-container {
        animation: fadeIn 0.5s ease-out 0.1s backwards;
      }

      .buttons-container {
        animation: fadeIn 0.5s ease-out 0.2s backwards;
      }

      /* Responsive */
      @media (max-width: 768px) {
        main {
          padding-top: 80px;
        }

        .logo-text {
          font-size: 60px;
        }

        .footer-links {
          flex-direction: column;
        }

        .footer-left,
        .footer-right {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <div class="apps-icon">
        <svg focusable="false" viewBox="0 0 24 24">
          <path
            d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"
          ></path>
        </svg>
      </div>
      <button class="sign-in-btn">Connexion</button>
    </header>

    <main>
      <div class="logo">
        <div class="logo-text">
          <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span
          ><span>e</span>
        </div>
      </div>

      <div class="search-container">
        <div class="search-bar" id="searchBar">
          <div class="search-icon">
            <svg focusable="false" viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              ></path>
            </svg>
          </div>
          <input
            type="text"
            class="search-input"
            id="searchInput"
            autocomplete="off"
            role="combobox"
            aria-live="polite"
          />
          <div class="voice-icon">
            <svg focusable="false" viewBox="0 0 24 24">
              <path
                fill="#4285f4"
                d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"
              ></path>
              <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
              <path
                fill="#fbbc04"
                d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"
              ></path>
              <path
                fill="#ea4335"
                d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"
              ></path>
            </svg>
          </div>
          <div class="lens-icon">
            <svg focusable="false" viewBox="0 0 192 192">
              <rect fill="none" height="192" width="192"></rect>
              <g>
                <circle fill="#34a853" cx="144.07" cy="144" r="16"></circle>
                <circle fill="#4285f4" cx="96.07" cy="104" r="24"></circle>
                <path
                  fill="#ea4335"
                  d="M24,135.2c0,18.11,14.69,32.8,32.8,32.8H96v-16l-40.1-0.1c-8.8,0-15.9-8.19-15.9-17.9v-18H24V135.2z"
                ></path>
                <path
                  fill="#fbbc04"
                  d="M168,72.8c0-18.11-14.69-32.8-32.8-32.8H116l20,16c8.8,0,16,8.29,16,18v30h16V72.8z"
                ></path>
                <path
                  fill="#4285f4"
                  d="M112,24l-32,0L68,40H56.8C38.69,40,24,54.69,24,72.8V92h16V74c0-9.71,7.2-18,16-18h80L112,24z"
                ></path>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <div class="buttons-container">
        <button class="search-btn">Recherche Google</button>
        <button class="search-btn">J'ai de la chance</button>
      </div>

      <div class="language-offered">
        Google disponible en :
        <a href="#">English</a>
      </div>
    </main>

    <footer>
      <div class="footer-country">France</div>
      <div class="footer-links">
        <div class="footer-left">
          <a href="#">À propos</a>
          <a href="#">Publicité</a>
          <a href="#">Entreprise</a>
          <a href="#">Comment fonctionne la recherche Google ?</a>
        </div>
        <div class="footer-right">
          <a href="#">Confidentialité</a>
          <a href="#">Conditions</a>
          <a href="#">Paramètres</a>
        </div>
      </div>
    </footer>

    <script>
      const searchBar = document.getElementById("searchBar");
      const searchInput = document.getElementById("searchInput");

      searchInput.addEventListener("focus", () => {
        searchBar.classList.add("focused");
      });

      searchInput.addEventListener("blur", () => {
        searchBar.classList.remove("focused");
      });

      // Effet de survol sur la barre de recherche
      searchBar.addEventListener("mouseenter", () => {
        if (!searchInput.matches(":focus")) {
          searchBar.style.boxShadow = "0 1px 6px rgba(32,33,36,.28)";
        }
      });

      searchBar.addEventListener("mouseleave", () => {
        if (!searchInput.matches(":focus")) {
          searchBar.style.boxShadow = "";
        }
      });
    </script>
  </body>
</html>
